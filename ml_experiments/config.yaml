# ComicTypeset AI — ML Training Configuration
experiment_name: "mobilenetv2_unet_bubble_seg"
seed: 42

data:
  real_data_dir: "data/processed/real"
  synthetic_data_dir: "data/processed/synthetic"
  image_size: [512, 512]
  channels: 3
  train_split: 0.80
  val_split: 0.10
  test_split: 0.10
  augment:
    horizontal_flip_prob: 0.5
    rotation_limit: 15
    brightness_contrast_prob: 0.3

model:
  name: "MobileNetV2-UNet"
  encoder_weights: "imagenet"
  freeze_encoder: false
  input_shape: [512, 512, 3]
  output_classes: 1
  activation: "sigmoid"

training:
  batch_size: 8
  learning_rate: 0.0001
  epochs: 20
  mixed_precision: true
  bce_weight: 0.5
  dice_weight: 0.5
  checkpoint_dir: "../backend/models"
  best_model_name: "bubble_unet.keras"
